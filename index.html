<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scorpions V002 - 5 Teams LIVE</title>
<style>
:root{--ink:#0B0E13;--surface:#141A22;--surface2:#1B232E;--line:#27313F;--red:#b30000;--muted:#8A97A6;--font:system-ui,-apple-system,Segoe UI,Roboto,Arial}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:#fff;font-family:var(--font);padding:18px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.top img{width:44px;height:44px;background:#fff;border-radius:8px;padding:3px}
h1{margin:0;font-size:19px}.badge{background:#b30000;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:800}
.layout{display:grid;grid-template-columns:340px 1fr;gap:18px}@media(max-width:900px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
label{font-size:11px;color:var(--muted);font-weight:700;margin:10px 0 4px;display:block;text-transform:uppercase;letter-spacing:.08em}
select{width:100%;background:var(--surface2);border:1px solid var(--line);color:#fff;border-radius:9px;padding:9px}
.seg{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;background:transparent;border:0;color:var(--muted);font-weight:800;font-size:12px;padding:8px;border-radius:7px;cursor:pointer}
.seg button.active{background:var(--red);color:#fff}
.info{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px}.info b{color:#fff}
.btn{width:100%;padding:10px;border-radius:9px;border:0;font-weight:800;cursor:pointer;margin-top:8px}
.btn-primary{background:var(--red);color:#fff}.btn-ghost{background:var(--surface2);color:#fff;border:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
canvas{width:360px;max-width:100%;background:#000;border-radius:8px}
</style></head>
<body>
<div class="top"><img src="https://i.imgur.com/ZKh41DS.jpeg"><div><h1>Scorpions SG Gierath <span class="badge">5 TEAMS</span></h1><div style="font-size:12px;color:var(--muted)">U10 · U12 · U16w · U18 · Damen 1 · direkt von BBK/WBV</div></div></div>
<div class="layout">
<div class="panel">
<label>Grafik-Typ</label>
<div class="seg" id="typeSeg"><button data-type="termine" class="active">Termine</button><button data-type="ergebnisse">Ergebnisse</button></div>
<label>Woche</label><select id="week"></select>
<label>Team</label><select id="teamFilter"><option value="ALL">Alle 5 Teams</option></select>
<div class="info" id="info">Lade 5 Ligen direkt von basketball-bund.net...</div>
<button class="btn btn-ghost" id="reload">Neu laden</button>
<button class="btn btn-primary" id="dl">Download PNGs</button>
</div>
<div><div class="card"><canvas id="cv_post" width="1080" height="1080"></canvas></div><div class="card"><canvas id="cv_story" width="1080" height="1920"></canvas></div></div>
</div>
<script>
const CFG={
 thema:"#b30000", logo:"https://i.imgur.com/ZKh41DS.jpeg",
 teams:[
  {label:"U10", liga_id:"55481", verband:"BBK"},
  {label:"U12", liga_id:"55482", verband:"BBK"},
  {label:"U16w", liga_id:"55431", verband:"BBK"},
  {label:"U18", liga_id:"55495", verband:"BBK"},
  {label:"Damen 1", liga_id:"54651", verband:"WBV"}
 ]
};
const LOGO=new Image(); LOGO.crossOrigin="anonymous"; LOGO.src=CFG.logo; LOGO.onload=()=>draw(); LOGO.onerror=()=>draw();
const CV={post:cv_post, story:cv_story};
let allGames=[]; let weeks=[]; let state={week:0, filter:"ALL", type:"termine"};
function parseDatum(s){let m=String(s||"").match(/(\d{2})\.(\d{2})\.(\d{4})/); if(m) return {date:`${m[1]}.${m[2]}.${m[3]}`, dt:new Date(+m[3],+m[2]-1,+m[1])}; return null;}
async function fetchLiga(team){
 const target=`https://www.basketball-bund.net/index.jsp?Action=101&liga_id=${team.liga_id}`;
 const proxy=`https://api.allorigins.win/get?url=${encodeURIComponent(target)}`;
 try{
  const r=await fetch(proxy); const j=await r.json(); const html=j.contents;
  const doc=new DOMParser().parseFromString(html,'text/html');
  const rows=[...doc.querySelectorAll('tr')]; let games=[];
  rows.forEach(tr=>{
   const tds=[...tr.querySelectorAll('td')].map(td=>td.textContent.trim());
   if(tds.length<6) return;
   let datumStr=tds.find(x=>/\d{2}\.\d{2}\.\d{4}/.test(x)); if(!datumStr) return;
   let zeit=tds.find(x=>/^\d{2}:\d{2}/.test(x))||""; let heim=tds[4]||""; let gast=tds[5]||""; let erg=tds[6]||"";
   if(!heim||!gast||heim==="Heim"||gast==="Gast") return;
   let pd=parseDatum(datumStr); if(!pd) return;
   games.push({_label:team.label, _date:pd.date, _dt:pd.dt, _time:zeit, Heim:heim, Gast:gast, Ergebnis:erg, liga_id:team.liga_id});
  });
  return games;
 }catch(e){console.warn(team.label,e); return [];}
}
async function loadAll(){
 document.getElementById('info').textContent="Lade 5 Ligen...";
 const results=await Promise.all(CFG.teams.map(t=>fetchLiga(t)));
 allGames=[].concat(...results); allGames.sort((a,b)=>a._dt-b._dt);
 let filtered=allGames;
 if(state.filter!=="ALL") filtered=filtered.filter(g=>g._label===state.filter);
 let w=[]; let cur=null;
 filtered.forEach(g=>{ if(!cur || (g._dt-cur.end)/86400000>6){ cur={items:[g], start:g._dt, end:g._dt, label:g._date}; w.push(cur);} else {cur.items.push(g); cur.end=g._dt;}});
 weeks=w;
 document.getElementById('week').innerHTML=weeks.map((x,i)=>`<option value="${i}">${x.label} (${x.items.length} Spiele)</option>`).join('') || `<option>keine Termine - Ligen sind leer</option>`;
 if(state.week>=weeks.length) state.week=0;
 document.getElementById('info').innerHTML=`<b>${allGames.length} Spiele gesamt</b><br>`+CFG.teams.map(t=>`${t.label} (${t.liga_id}): ${allGames.filter(g=>g.liga_id==t.liga_id).length} Spiele`).join('<br>');
 draw();
}
function draw(){
 const wk=weeks[state.week]; if(!wk){ for(let k in CV){let c=CV[k].getContext('2d'); c.fillStyle="#0B0E13"; c.fillRect(0,0,CV[k].width,CV[k].height); c.fillStyle="#8A97A6"; c.font="20px system-ui"; c.fillText("Keine Daten",50,100);} return;}
 for(let key in CV){
  let cv=CV[key]; let c=cv.getContext('2d'); let W=cv.width,H=cv.height,S=Math.min(W,H);
  c.fillStyle="#0B0E13"; c.fillRect(0,0,W,H); c.fillStyle="#141A22"; c.fillRect(W*0.045,H*0.045,W*0.91,H*0.91);
  c.fillStyle=CFG.thema; c.fillRect(W*0.045,H*0.045,W*0.91,12);
  c.fillStyle="#fff"; c.font=`900 ${S*0.032}px system-ui`; c.fillText((wk.label+" - "+state.type).toUpperCase(),W*0.07,H*0.11);
  let y=H*0.16; wk.items.slice(0,6).forEach(r=>{
   c.fillStyle="#1B232E"; c.fillRect(W*0.07,y,W*0.86,H*0.07); c.fillStyle="#b30000"; c.fillRect(W*0.07,y,W*0.12,H*0.07);
   c.fillStyle="#fff"; c.font=`800 ${S*0.018}px system-ui`; c.textAlign="center"; c.fillText(r._label,W*0.13,y+H*0.042);
   c.textAlign="left"; c.fillStyle="#fff"; c.font=`700 ${S*0.018}px system-ui`; c.fillText(`${r.Heim} vs ${r.Gast}`,W*0.22,y+H*0.03);
   c.fillStyle="#8A97A6"; c.font=`600 ${S*0.014}px system-ui`; c.fillText(`${r._date} ${r._time} ${r.Ergebnis||""}`,W*0.22,y+H*0.055); y+=H*0.08;
  });
 }
}
document.getElementById('teamFilter').innerHTML='<option value="ALL">Alle 5 Teams</option>'+CFG.teams.map(t=>`<option value="${t.label}">${t.label} - ${t.liga_id}</option>`).join('');
document.getElementById('teamFilter').addEventListener('change',e=>{state.filter=e.target.value; loadAll();});
document.getElementById('week').addEventListener('change',e=>{state.week=+e.target.value; draw();});
document.getElementById('typeSeg').addEventListener('click',e=>{ if(e.target.tagName!=="BUTTON") return; document.querySelectorAll('#typeSeg button').forEach(b=>b.classList.remove('active')); e.target.classList.add('active'); state.type=e.target.dataset.type; loadAll();});
document.getElementById('reload').addEventListener('click',()=>loadAll());
document.getElementById('dl').addEventListener('click',()=>{ for(let k in CV){ CV[k].toBlob(b=>{ let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`scorpions_${state.type}_${k}.png`; a.click(); }); }});
loadAll();
</script>
</body>
</html>
