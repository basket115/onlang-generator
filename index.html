<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V002 FIX - Termine</title>
<style>
body{background:#0B0E13;color:#fff;font-family:system-ui;padding:16px}
.panel{background:#141A22;border:1px solid #27313F;border-radius:14px;padding:14px;max-width:400px}
select,button{width:100%;margin:6px 0;padding:10px;border-radius:10px;border:1px solid #27313F;background:#1B232E;color:#fff}
button.active{background:#b30000}
canvas{background:#000;border-radius:10px;width:100%;max-width:500px}
#log{font-family:monospace;font-size:11px;color:#9fb0c0;white-space:pre-wrap;background:#0d1117;border:1px solid #27313F;border-radius:8px;padding:8px;max-height:150px;overflow:auto}
</style>
</head>
<body>
<h3>Scorpions V002 - Termine FIX</h3>
<div class="panel">
<div style="display:flex;gap:4px">
<button data-type="termine" class="active">Termine</button>
<button data-type="ergebnisse">Ergebnisse</button>
</div>
<label>Woche</label><select id="week"></select>
<label>Team</label><select id="team"></select>
<div id="info" style="font-size:12px;color:#8A97A6;margin-top:8px">Lade...</div>
<div id="log"></div>
<button id="refresh">Cache leeren</button>
</div>
<canvas id="cv" width="1080" height="1080" style="margin-top:16px"></canvas>
<script>
const GAS="https://script.google.com/macros/s/AKfycbzrvPIQsGaqHP28_9G-geahMB0QMYHlbylnGLUTeJagi1Sc_rgPVErasrhc0HGGthppYA/exec";
const CFG={"name":"Scorpions SG Gierath","kurz":"Scorpions","suchname":"SG Rot-Weiß Gierath","thema":"#b30000","teams":[{"label":"U10","mannschaft":"U10 Kreisliga","teamSl":"SG Rot-Weiß Gierath","liga_id":"55481"},{"label":"U12","mannschaft":"U12 Kreisliga","teamSl":"SG RW Gierath","liga_id":"55482"},{"label":"U16w","mannschaft":"U16 Kreisliga (w)","teamSl":"SG RW Gierath","liga_id":"55431"},{"label":"U18","mannschaft":"U18 Kreisliga","teamSl":"SG RW Gierath","liga_id":"55495"}]};
const TEAMS=CFG.teams; const cache={};
function log(m){document.getElementById('log').textContent+=m+"\n"; console.log(m);}
function parseDatum(s){s=String(s||"").trim(); let m=s.match(/(\d{4})[-/\.](\d{1,2})[-/\.](\d{1,2})/); if(m) return {date:`${m[3].padStart(2,'0')}.${m[2].padStart(2,'0')}.${m[1]}`,dt:new Date(+m[1],+m[2]-1,+m[3])}; m=s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/); if(m) return {date:`${m[1].padStart(2,'0')}.${m[2].padStart(2,'0')}.${m[3]}`,dt:new Date(+m[3],+m[2]-1,+m[1])}; return {date:s,dt:null};}
async function gasGet(action,team){const url=`${GAS}?action=${action}&vereinName=${encodeURIComponent(CFG.suchname)}&mannschaft=${encodeURIComponent(team.mannschaft)}&teamSlTeamname=${encodeURIComponent(team.teamSl)}`; log(`Lade ${team.label}...`); const r=await fetch(url); const d=await r.json(); return d[action==="getBbkSpielplan"?"spielplan":"ergebnisse"]||[];}
async function loadSpiele(action){if(cache[action]) return cache[action]; let merged=[]; for(let t of TEAMS){let data=await gasGet(action,t); data.forEach(x=>{let p=parseDatum(x.Datum); if(!p.dt) return; merged.push({...x,_label:t.label,_date:p.date,_dt:p.dt,_time:x.Uhrzeit||""});});} let now=new Date(); now.setHours(0,0,0,0); if(action==="getBbkSpielplan") merged=merged.filter(x=>x._dt>=now); merged.sort((a,b)=>a._dt-b._dt); cache[action]=merged; log(`Fertig: ${merged.length} Spiele`); return merged;}
function getMonday(d){let nd=new Date(d); let day=nd.getDay()||7; nd.setDate(nd.getDate()-(day-1)); nd.setHours(0,0,0,0); return nd;}
function buildWeeks(items){let map=new Map(); items.forEach(x=>{let k=getMonday(x._dt).toISOString(); if(!map.has(k)) map.set(k,{start:getMonday(x._dt),items:[]}); map.get(k).items.push(x);}); return [...map.values()].sort((a,b)=>a.start-b.start).map(g=>({label:g.start.toLocaleDateString('de-DE'),items:g.items}));}
let state={type:'termine',weekIdx:0,teamIdx:-1}; let weeks=[];
async function render(){let action=state.type==="termine"?"getBbkSpielplan":"getBbkErgebnisse"; let data=await loadSpiele(action); if(state.teamIdx>=0) data=data.filter(x=>x._label===TEAMS[state.teamIdx].label); weeks=buildWeeks(data); let sel=document.getElementById('week'); sel.innerHTML=weeks.map((w,i)=>`<option value="${i}">${w.label} (${w.items.length})</option>`).join('')||'<option>keine Termine</option>'; let wk=weeks[state.weekIdx]||weeks[0]; if(!wk){document.getElementById('info').textContent='Keine Termine im Sheet'; return;} let cv=document.getElementById('cv'),c=cv.getContext('2d'); c.fillStyle='#0B0E13'; c.fillRect(0,0,1080,1080); c.fillStyle='#141A22'; c.fillRect(40,40,1000,1000); c.fillStyle=CFG.thema; c.fillRect(40,40,1000,12); c.fillStyle='#fff'; c.font='900 36px system-ui'; c.fillText(wk.label.toUpperCase(),70,120); let y=180; wk.items.slice(0,6).forEach(r=>{c.fillStyle='#1B232E'; c.fillRect(70,y,940,90); c.fillStyle='#fff'; c.font='700 22px system-ui'; c.fillText(`${r._label}: ${r.Heim} vs ${r.Gast}`,90,y+35); c.fillStyle='#8A97A6'; c.font='600 18px system-ui'; c.fillText(`${r._date} ${r._time}`,90,y+65); y+=100;}); document.getElementById('info').innerHTML=`<b>${wk.label}</b> ${wk.items.length} Spiele<br>`+wk.items.map(i=>`-${i._label}: ${i.Heim}-${i.Gast} ${i._date}`).join('<br>');}
document.getElementById('team').innerHTML='<option value="-1">Alle Teams</option>'+TEAMS.map((t,i)=>`<option value="${i}">${t.label}</option>`).join('');
document.getElementById('team').addEventListener('change',e=>{state.teamIdx=parseInt(e.target.value); state.weekIdx=0; render();});
document.getElementById('week').addEventListener('change',e=>{state.weekIdx=parseInt(e.target.value); render();});
document.querySelectorAll('button[data-type]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('button[data-type]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); state.type=b.dataset.type; state.weekIdx=0; render();}));
document.getElementById('refresh').addEventListener('click',()=>{for(let k in cache) delete cache[k]; document.getElementById('log').textContent=''; render();});
render();
</script>
</body>
</html>
